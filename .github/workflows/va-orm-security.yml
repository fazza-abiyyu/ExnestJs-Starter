name: VA-ORM Security

on:
  push:
    paths:
      - "engine/va-orm/**"
      - ".github/workflows/va-orm-security.yml"
  pull_request:
    paths:
      - "engine/va-orm/**"
      - ".github/workflows/va-orm-security.yml"

defaults:
  run:
    working-directory: engine/va-orm

jobs:
  security-audit:
    name: Security audit (fail on CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run security audit
        run: bun run security:audit

      - name: Run test suite
        run: bun test
